<canvas id="chart-{{ entity|replace(' ', '_') }}" height="80" aria-label="Price chart" role="img"></canvas>
<script>
    (function() {
        const data = {{ history|tojson|safe }};
        if (!data || data.length === 0) {
            document.getElementById('chart-{{ entity|replace(" ", "_") }}').parentElement.innerHTML =
                '<p class="text-muted text-center">No history data yet.</p>';
            return;
        }

        const ctx = document.getElementById('chart-{{ entity|replace(" ", "_") }}').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(p => new Date(p.recorded_at).toLocaleDateString()),
                datasets: [{
                    label: 'Chaos Value',
                    data: data.map(p => p.price_chaos),
                    borderColor: getComputedStyle(document.documentElement).getPropertyValue('--chart-line').trim(),
                    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--chart-fill').trim(),
                    fill: true,
                    tension: 0.3,
                    pointRadius: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { maxTicksLimit: 8, display: false } },
                    y: { ticks: { }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });
    })();
</script>
